name: Rebuild WASM Engine

on:
  push:
    branches: [master]
    paths:
      - 'src/**/*.c'
      - 'include/**/*.h'
      - 'docs/wasm_engine.js'
      - 'docs/symbolic_wasm.c'
      - '.github/workflows/wasm-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wasm-rebuild
  cancel-in-progress: true

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install latest
          /tmp/emsdk/emsdk activate latest
          echo "/tmp/emsdk/upstream/emscripten" >> $GITHUB_PATH
          echo "EMSDK=/tmp/emsdk" >> $GITHUB_ENV

      - name: Verify emcc
        run: emcc --version

      - name: Build WASM
        run: |
          emcc -O2 \
            -s WASM=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s MODULARIZE=1 \
            -s EXPORT_NAME="SymbolicLLM" \
            -s "EXPORTED_FUNCTIONS=['_wasm_init','_wasm_load_corpus','_wasm_load_model','_wasm_fact_count','_wasm_symbol_count','_wasm_relation_count','_wasm_turn_count','_wasm_sentence_count','_wasm_query','_wasm_learn','_wasm_episodic_count','_wasm_reset','_wasm_set_persona','_wasm_get_persona','_malloc','_free']" \
            -s "EXPORTED_RUNTIME_METHODS=['ccall','cwrap','UTF8ToString','stringToUTF8','FS']" \
            -s ASSERTIONS=1 \
            -s FORCE_FILESYSTEM=1 \
            -Wno-pointer-sign \
            -I include \
            src/schema.c src/metaschema.c src/meta_graph.c src/graph.c \
            src/relation.c src/symbol.c src/model.c src/graph_reasoning.c \
            src/learning.c src/learn.c src/cognitive_learning.c src/transfer.c \
            src/transfer_legacy.c src/neuro_prolog.c src/neuro_rules.c src/c_rules.c \
            src/tokenizer.c src/parser.c src/stem.c src/i18n.c src/text_lex.c \
            src/ingest.c src/chat.c src/chat_clarify.c src/dialog.c src/context.c \
            src/nlg.c src/deep_nlg.c src/stochastic_nlg.c src/passage_nlg.c src/generator.c \
            src/vsa.c src/ccg_realizer.c src/commonsense.c src/persona.c src/episodic_memory.c \
            src/embedding.c src/dict.c src/qa_layer.c src/export.c src/numeric.c \
            src/prune.c src/stats.c src/server_proto.c src/tool_config.c src/tool_executor.c \
            docs/symbolic_wasm.c \
            -lm \
            -o docs/symbolic_wasm.js

      - name: Verify WASM
        run: |
          ls -lh docs/symbolic_wasm.wasm docs/symbolic_wasm.js
          echo "WASM size: $(du -h docs/symbolic_wasm.wasm | cut -f1)"

      - name: Commit updated WASM binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/symbolic_wasm.wasm docs/symbolic_wasm.js
          if git diff --cached --quiet; then
            echo "No WASM changes to commit"
          else
            git commit -m "chore(wasm): rebuild C11 engine to WASM [skip ci]"
            git push
          fi
