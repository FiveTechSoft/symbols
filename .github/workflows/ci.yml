name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit SHA to validate
        required: true
        type: string
  workflow_call:
    inputs:
      target_sha:
        description: Commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-test-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Configure (MSVC)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j4
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: NTFS measurement probe (output only)
        run: .\build\Release\test_fs_win_probe.exe
      - name: Corpus lint (gate)
        run: python tools/lint_corpus.py --check

  build-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3
      - name: Configure (gcc)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j4
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: race_parent writer OK counts (output only, not a gate)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            ctest --test-dir build -R '^test_fs_race_parent$' -V | grep -E 'swaps [0-9]+, writer calls OK|ALL PASS|Test +#'
          done
      - name: Corpus lint (gate)
        run: python3 tools/lint_corpus.py --check

  ast-inspect-windows-ninja:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install pinned libclang and Ninja
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check libclang==18.1.1 ninja==1.11.1.4
          if ($LASTEXITCODE -ne 0) { throw 'pip install of the pinned libclang and Ninja failed' }
          python -c "import importlib.metadata as m; assert m.version('libclang') == '18.1.1'; assert m.version('ninja') == '1.11.1.4'; print('libclang', m.version('libclang'), 'ninja', m.version('ninja'))"
          if ($LASTEXITCODE -ne 0) { throw 'pinned package versions not installed' }
          ninja --version
          if ($LASTEXITCODE -ne 0) { throw 'ninja not runnable' }
      - name: Generate compilation database with Ninja
        shell: pwsh
        run: |
          cmake -S . -B build-ast -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          if (-not (Test-Path build-ast/compile_commands.json)) { throw 'compile_commands.json not generated' }
          python -c "import json; from pathlib import Path; p=Path('build-ast/compile_commands.json'); d=json.loads(p.read_text()); assert d and any(Path(x['file']).name == 'task_ops.c' for x in d); print('compile DB entries:', len(d))"
      - name: Run native Windows AST corpus with pinned libclang
        shell: pwsh
        run: |
          python tests/test_ast_inspect.py -v 2>&1 | Tee-Object -FilePath ast-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path ast-tests.log -Pattern 'skipped') { throw 'AST tests were skipped; the job must run them' }
          if (-not (Select-String -Path ast-tests.log -Pattern '^OK')) { throw 'AST tests did not report OK' }

  asan-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Configure (MSVC + ASan)
        run: cmake -S . -B build-asan -DCMAKE_C_FLAGS="/fsanitize=address"
      - name: Build
        run: cmake --build build-asan --config Debug -j4
      - name: Tests under ASan
        shell: pwsh
        run: |
          $dll = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "clang_rt.asan_dbg_dynamic-x86_64.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw "ASan runtime DLL not found" }
          $env:PATH = "$($dll.DirectoryName);$env:PATH"
          ctest --test-dir build-asan -C Debug --output-on-failure
