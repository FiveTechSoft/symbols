name: Compilers and sanitizers (manual)

# M3 exit criterion 3 needs a Clang build and a sanitizer job on Linux. This workflow
# is manual only, so a red result here does not touch the CI gate. Fold the jobs into
# ci.yml once a run of each is read green.
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit SHA to validate (empty means the dispatched ref)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-test-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 clang
      - name: Toolchain
        run: |
          clang --version
          cmake --version
      - name: Configure (clang)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang
      - name: Build
        run: cmake --build build -j4
      - name: Tests
        run: ctest --test-dir build --output-on-failure

  asan-ubsan-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3
      - name: Toolchain
        run: |
          gcc --version
          cmake --version
      # The e2e and typed_c tests look for symbols-server and c_contract_static under build/ and skip or
      # fail without them, so the sanitizer build uses build/ too.
      - name: Configure (gcc, ASan and UBSan)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j4
      - name: Tests under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0:print_stacktrace=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
