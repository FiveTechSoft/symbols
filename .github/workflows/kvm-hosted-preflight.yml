name: Exploratory hosted KVM preflight

on:
  workflow_dispatch:

permissions: {}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install distro QEMU, static BusyBox, and kernel image
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 busybox-static linux-image-generic
          kernel=$(find /boot -maxdepth 1 -type f -name 'vmlinuz-*-generic' -print | sort -V | tail -n 1)
          test -n "$kernel" && test -s "$kernel"
          sudo cp "$kernel" "$RUNNER_TEMP/preflight-vmlinuz"
          sudo chmod 644 "$RUNNER_TEMP/preflight-vmlinuz"
          printf '%s\n' "$RUNNER_TEMP/preflight-vmlinuz" > "$RUNNER_TEMP/preflight-kernel-path"
      - name: Fetch commit-pinned probe and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --connect-timeout 10 --max-time 30 --max-filesize 100000 \
            --output "$RUNNER_TEMP/kvm_preflight.py" \
            -- 'https://raw.githubusercontent.com/FiveTechSoft/symbols/360ff9854a9487fc1db151c2b7fd1d624bd1ee4d/tools/kvm_preflight/probe.py'
          printf '%s  %s\n' 'd11fb5de634021b380a29e50f33d86d365ca9c72969d7d90422acc5d4a8f7309' "$RUNNER_TEMP/kvm_preflight.py" | sha256sum --check --status
      - name: Probe KVM and three QEMU microvm boots
        shell: bash
        run: |
          set -uo pipefail
          kernel=$(cat "$RUNNER_TEMP/preflight-kernel-path")
          set +e
          timeout --signal=TERM --kill-after=5s 120s \
            python3 "$RUNNER_TEMP/kvm_preflight.py" \
              --kernel "$kernel" --busybox /usr/bin/busybox \
              --qemu /usr/bin/qemu-system-x86_64 \
              --boot-timeout 20 --json-out "$RUNNER_TEMP/preflight.json"
          status=$?
          set -e
          if test -s "$RUNNER_TEMP/preflight.json"; then
            cat "$RUNNER_TEMP/preflight.json"
          else
            printf '%s\n' '{"schema":"symbols.kvm-hosted-preflight.v1","status":"fail","error":{"phase":"host_timeout_or_crash","code":"no_json"}}'
          fi
          exit "$status"
