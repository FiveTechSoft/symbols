name: Apply validated patch

on:
  workflow_dispatch:
    inputs:
      message:
        description: Commit message
        required: true
        type: string
      expected_head:
        description: Expected master SHA before applying
        required: true
        type: string
      patch_base64:
        description: Base64-encoded unified diff (choose this or patch_url)
        required: false
        type: string
      patch_url:
        description: Pinned raw GitHub URL of a .patch file (choose this or inline)
        required: false
        type: string
      patch_sha256:
        description: Lowercase SHA-256 of URL payload; required with patch_url
        required: false
        type: string
      dry_run:
        description: Run every check, build, test and a local commit, then stop before updating master
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: apply-validated-patch-master
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      committed_sha: ${{ steps.commit.outputs.sha }}
      already_applied: ${{ steps.state.outputs.already_applied }}
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Build the Git gate from the current master
        shell: bash
        run: |
          set -euo pipefail
          # Built before the patch is applied, outside the workspace, so the patch
          # being checked cannot change the gate that checks it.
          cmake -S . -B "$RUNNER_TEMP/gate-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/gate-build" --target symbols_git_gate --parallel 2
          cp "$RUNNER_TEMP/gate-build/symbols_git_gate" "$RUNNER_TEMP/symbols_git_gate"
          test -x "$RUNNER_TEMP/symbols_git_gate"

      - name: Validate request and patch
        env:
          PATCH_BASE64: ${{ inputs.patch_base64 }}
          PATCH_URL: ${{ inputs.patch_url }}
          PATCH_SHA256: ${{ inputs.patch_sha256 }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          COMMIT_MESSAGE: ${{ inputs.message }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${COMMIT_MESSAGE//[[:space:]]/}" || { echo 'Commit message is empty'; exit 1; }
          test "$EXPECTED_HEAD" = "$(git rev-parse HEAD)" || { echo 'master moved; refusing stale patch'; exit 1; }
          # Exactly one source. Keep the existing inline decoding path for small diffs.
          if [ -n "$PATCH_BASE64" ]; then
            test -z "$PATCH_URL" && test -z "$PATCH_SHA256" || { echo 'Choose one patch source'; exit 1; }
            printf '%s' "$PATCH_BASE64" | base64 --decode > "$RUNNER_TEMP/change.patch"
          else
            test -n "$PATCH_URL" || { echo 'Patch is empty'; exit 1; }
            case "$PATCH_URL" in
              https://*) ;;
              *) echo 'Patch URL must use HTTPS'; exit 1 ;;
            esac
            # Refuse credentials, fragments, ports and non-public hosts before requesting bytes.
            [[ "$PATCH_URL" =~ ^https://([a-zA-Z0-9.-]+)(:[0-9]+)?/[^[:space:]#@]*$ ]] || { echo 'Invalid patch URL'; exit 1; }
            host="${BASH_REMATCH[1],,}"
            test -z "${BASH_REMATCH[2]}" || { echo 'Nondefault port is not allowed'; exit 1; }
            case "$host" in
              raw.githubusercontent.com) ;;
              *) echo 'Patch URL host is not allowlisted'; exit 1 ;;
            esac
            # Stage the patch on another branch/commit of this repo; master stays guarded.
            # Pin source bytes to an immutable commit, not a moving branch name.
            [[ "$PATCH_URL" =~ ^https://raw\.githubusercontent\.com/FiveTechSoft/symbols/[0-9a-f]{40}/[A-Za-z0-9_./-]+\.patch$ ]] || { echo 'Patch URL must be a pinned Symbols raw file'; exit 1; }
            [[ "$PATCH_URL" != *"/../"* && "$PATCH_URL" != *"/./"* ]] || { echo 'Dot segments in URL are not allowed'; exit 1; }
            [[ "$PATCH_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'URL patch needs a lowercase SHA-256'; exit 1; }
            curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
              --connect-timeout 10 --max-time 30 --max-filesize 2097152 \
              --output "$RUNNER_TEMP/change.patch" -- "$PATCH_URL"
            test "$(sha256sum "$RUNNER_TEMP/change.patch" | cut -d ' ' -f 1)" = "$PATCH_SHA256" || { echo 'Patch SHA-256 mismatch'; exit 1; }
          fi
          test -s "$RUNNER_TEMP/change.patch" || { echo 'Patch is empty'; exit 1; }
          test "$(wc -c < "$RUNNER_TEMP/change.patch")" -le 2097152 || { echo 'Patch exceeds 2 MiB'; exit 1; }
          grep -q '^diff --git a/.* b/.*$' "$RUNNER_TEMP/change.patch" || { echo 'Not a unified git diff'; exit 1; }
          git apply --numstat "$RUNNER_TEMP/change.patch" > "$RUNNER_TEMP/numstat"
          test -s "$RUNNER_TEMP/numstat" || { echo 'Patch changes no files'; exit 1; }
          test "$(wc -l < "$RUNNER_TEMP/numstat")" -le 40 || { echo 'Patch changes more than 40 files'; exit 1; }
          while IFS=$'\t' read -r added deleted path; do
            case "$path" in
              src/*|include/*|tests/*|tools/*|CMakeLists.txt|README.md|ROADMAP.md|COORDINATION.md|AGENTS.md|CHANGELOG.md|.gitignore|docs/*) ;;
              *) echo "Disallowed path: $path"; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/numstat"
          
      - name: Git preflight and already-applied check
        id: state
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        shell: bash
        run: |
          set -euo pipefail
          GATE="$RUNNER_TEMP/symbols_git_gate"
          "$GATE" preflight --expected-head "$EXPECTED_HEAD" --branch master
          # Explicit remote check: master on origin must be exactly this HEAD.
          remote="$(git ls-remote --exit-code origin refs/heads/master | cut -f1)"
          test "$remote" = "$(git rev-parse HEAD)" || { echo "origin/master is $remote, not $(git rev-parse HEAD)"; exit 1; }
          # The patch goes to a relative path under .git: not tracked, not shown by
          # git status, not picked up by git add, and a relative path as the gate requires.
          cp "$RUNNER_TEMP/change.patch" .git/change.patch
          rc=0
          "$GATE" patch-state .git/change.patch || rc=$?
          case "$rc" in
            0) echo 'already_applied=false' >> "$GITHUB_OUTPUT" ;;
            3) echo 'already applied: the changes of this patch are already present; nothing to commit'
               echo 'already_applied=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "patch-state failed with exit $rc"; exit 1 ;;
          esac

      - name: Apply patch
        if: steps.state.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/change.patch"
          git diff --check
          test -n "$(git status --porcelain)" || { echo 'Patch produced no changes'; exit 1; }

      - name: Configure and build
        if: steps.state.outputs.already_applied != 'true'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2

      - name: Test
        if: steps.state.outputs.already_applied != 'true'
        run: ctest --test-dir build --output-on-failure

      - name: Commit and update master
        id: commit
        if: steps.state.outputs.already_applied != 'true'
        env:
          COMMIT_MESSAGE: ${{ inputs.message }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          GATE="$RUNNER_TEMP/symbols_git_gate"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src include tests tools CMakeLists.txt README.md ROADMAP.md COORDINATION.md AGENTS.md CHANGELOG.md .gitignore
          if [ -d docs ]; then
            git add -- docs
          fi
          git diff --cached --quiet && { echo 'Nothing to commit'; exit 1; }
          # The index must hold exactly the files of the reviewed patch.
          "$GATE" verify-staged .git/change.patch
          git commit -m "$COMMIT_MESSAGE"
          # The commit must change exactly the files of the reviewed patch.
          "$GATE" verify-head .git/change.patch
          if [ "$DRY_RUN" = 'true' ]; then
            echo 'dry run: all checks passed; master is not updated'
            git push --dry-run origin HEAD:master
            exit 0
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:master

  ci:
    needs: apply
    if: needs.apply.outputs.committed_sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      target_sha: ${{ needs.apply.outputs.committed_sha }}
