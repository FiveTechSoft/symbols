name: Diagnostic bounded read-only runner VM capability metadata (no boot)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact reviewed commit of this workflow and script
        required: true
        type: string
      runner_images:
        description: Canonical comma-separated set of 1-3 freshly measured ImageVersions
        required: true
        type: string

permissions: {}

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Validate identity before checkout
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          MEASURED_IMAGES: ${{ inputs.runner_images }}
        run: |
          set -euo pipefail
          # Fixed token file only: no values, environment or context dumps.
          umask 077
          printf '%s\n' guard_incomplete > "$RUNNER_TEMP/qemu-runner-vm-discovery-guard.txt"
          refuse() {
            printf '%s\n' "$1" > "$RUNNER_TEMP/qemu-runner-vm-discovery-guard.txt"
            printf '%s\n' "$1"
            exit 2
          }
          [[ "${TARGET_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || refuse target_sha_format
          # Strict canonical set: 1-3 distinct tokens, no whitespace or wildcard.
          [[ "${MEASURED_IMAGES:-}" =~ ^[0-9]{8}\.[0-9]+\.[0-9]+(,[0-9]{8}\.[0-9]+\.[0-9]+){0,2}$ ]] || refuse runner_image_format
          test "${#MEASURED_IMAGES}" -le 128 || refuse runner_image_format
          IFS=, read -r -a images <<< "$MEASURED_IMAGES"
          for ((i=0;i<${#images[@]};i++)); do
            for ((j=0;j<i;j++)); do
              test "${images[i]}" != "${images[j]}" || refuse runner_image_format
            done
          done
          test "${GITHUB_REF:-}" = refs/heads/master || refuse workflow_ref
          test "${GITHUB_SHA:-}" = "$TARGET_SHA" || refuse workflow_sha
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted || refuse runner_environment
          test "${RUNNER_OS:-}" = Linux || refuse runner_os
          test "${RUNNER_ARCH:-}" = X64 || refuse runner_arch
          [[ "${ImageVersion:-}" =~ ^[0-9]{8}\.[0-9]+\.[0-9]+$ ]] || refuse runner_image
          case ",$MEASURED_IMAGES," in
            *",$ImageVersion,"*) ;;
            *) refuse runner_image ;;
          esac
          printf '%s\n' guard_passed > "$RUNNER_TEMP/qemu-runner-vm-discovery-guard.txt"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - name: Verify checkout and run offline tests
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python3 tests/test_qemu_runner_vm_contract.py
          python3 tests/test_qemu_runner_vm_discovery.py
      - name: Observe self metadata only, always blocked
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          MEASURED_IMAGES: ${{ inputs.runner_images }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(id -u)" -ne 0
          # Revalidate membership here; keep the Python scalar identity check exact.
          [[ "${MEASURED_IMAGES:-}" =~ ^[0-9]{8}\.[0-9]+\.[0-9]+(,[0-9]{8}\.[0-9]+\.[0-9]+){0,2}$ ]] || exit 2
          test "${#MEASURED_IMAGES}" -le 128 || exit 2
          [[ "${ImageVersion:-}" =~ ^[0-9]{8}\.[0-9]+\.[0-9]+$ ]] || exit 2
          case ",$MEASURED_IMAGES," in
            *",$ImageVersion,"*) ;;
            *) exit 2 ;;
          esac
          EXPECTED_IMAGE="$ImageVersion"
          # Observer has no children; internal 10s deadline, outer 15s plus 2s kill grace.
          set +e
          timeout --signal=TERM --kill-after=2s 15s python3 tools/qemu_closure/runner_vm_discovery.py \
            "$TARGET_SHA" "$EXPECTED_IMAGE" > "$RUNNER_TEMP/qemu-runner-vm-discovery.json"
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            rm -f "$RUNNER_TEMP/qemu-runner-vm-discovery.json"
            exit 2
          fi
          # Keep the blocked exit code. A red run is an observation, never approval.
          exit 2
      - name: Upload fixed observer report, never host contents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-runner-vm-discovery
          path: ${{ runner.temp }}/qemu-runner-vm-discovery.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload fixed guard token, never rejected values
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-runner-vm-discovery-guard
          path: ${{ runner.temp }}/qemu-runner-vm-discovery-guard.txt
          if-no-files-found: error
          retention-days: 1
